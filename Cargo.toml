[package]
name = "rimze"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.39"
eframe = "0.35"
egui_extras = { version = "0.35", features = ["all_loaders"] }
encoding_rs = "0.8.33"
futures = "0.3.30"
image = { version = "0.25", features = ["png","gif","bmp","webp","avif"] }
# 真の LRU キャッシュ実装（O(1) の put/get/pop とアクセス順序管理）
lru = "0.18"
mime = "0.3.17"
mime_guess = "2.0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tokio-util = { version = "0.7", features = ["compat"] }
zip = "8.6"
lopdf = "0.44"
directories = "6.0"
natural-sort-rs = "0.2.1"
rfd = "0.17"
sha2 = "0.11"
hex = "0.4"

[profile.dev]
opt-level = 0

