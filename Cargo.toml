[package]
name = "rimze"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.39"
eframe = "*"
egui_extras = { version = "*", features = ["all_loaders"] }
encoding_rs = "0.8.33"
futures = "0.3.30"
image = { version = "0.24", features = ["png","gif","bmp","webp",] }
# 真の LRU キャッシュ実装（O(1) の put/get/pop とアクセス順序管理）
lru = "*"
mime = "0.3.17"
mime_guess = "2.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "*"
tokio = { version = "*", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tokio-util = { version = "*", features = ["compat"] }
zip = "0.6.6"
lopdf = "0.30.0"
directories = "5.0.1"
natural-sort-rs = "0.2.1"
rfd = "0.15.3"
sha2 = "0.10"
hex = "0.4"

[profile.dev]
opt-level = 0

